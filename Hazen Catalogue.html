<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Hazen — Radiance Redefined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preload" href="hazen-catalogue-app.js" as="script">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --bg: #fafaf8;
    --ink: #111110;
    --ink2: #555550;
    --ink3: #999990;
    --rule: #e2e0db;
    --gold: #b08d57;
    --luxury-gold: #d6b96f;
    --luxury-gold-soft: #f0dc9e;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  #cursor {
    position: fixed; width: 6px; height: 6px;
    background: var(--ink); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: width 0.25s, height 0.25s, background 0.25s;
  }
  #cursor-ring {
    position: fixed; width: 32px; height: 32px;
    border: 1px solid rgba(17,17,16,0.25); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: width 0.4s cubic-bezier(.25,.46,.45,.94), height 0.4s cubic-bezier(.25,.46,.45,.94), border-color 0.3s;
  }
  body.cursor-hover #cursor { width: 3px; height: 3px; }
  body.cursor-hover #cursor-ring { width: 50px; height: 50px; border-color: rgba(17,17,16,0.5); }
  body.cursor-open #cursor-ring { width: 70px; height: 70px; }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 48px; height: 68px;
    background: rgba(250,250,248,0.97);
    border-bottom: 1px solid var(--rule);
    backdrop-filter: blur(12px);
  }
  .nav-logo {
    font-family: var(--serif); font-size: 20px; font-weight: 400;
    letter-spacing: 0.18em; color: var(--ink); text-decoration: none;
    cursor: none; text-transform: uppercase;
  }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-link {
    font-family: var(--sans); font-size: 10px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink2); text-decoration: none;
    background: none; border: none; cursor: none;
    transition: color 0.2s; padding: 4px 0; position: relative;
  }
  .nav-link::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 100%; height: 1px;
    background: var(--ink); transition: right 0.3s cubic-bezier(.25,.46,.45,.94);
  }
  .nav-link:hover, .nav-link.active { color: var(--ink); }
  .nav-link:hover::after, .nav-link.active::after { right: 0; }
  .nav-cta {
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    border: 1px solid var(--ink); color: var(--ink);
    padding: 9px 22px; background: none; cursor: none;
    transition: background 0.25s, color 0.25s;
  }
  .nav-cta:hover { background: var(--ink); color: var(--white); }

  /* Loading screen */
  #loader {
    position: fixed; inset: 0; z-index: 1000;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,246,219,0.72) 0%, rgba(250,250,248,0.94) 30%, rgba(229,224,214,0.92) 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 32px;
    transition: opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1);
  }
  #loader.done { opacity: 0; pointer-events: none; transform: translateY(-8px); }
  .loader-brand {
    font-family: var(--serif); font-size: 28px; font-weight: 300;
    letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink);
    text-shadow: 0 0 26px rgba(176,141,87,0.28);
    opacity: 0; animation: fadeIn 0.8s 0.2s forwards;
  }
  .loader-light {
    position: relative; width: 190px; height: 2px;
    background: linear-gradient(to right, transparent, rgba(176,141,87,0.28), transparent);
    overflow: visible;
    opacity: 0; animation: fadeIn 0.5s 0.5s forwards;
  }
  .loader-beam {
    position: absolute; top: 0; left: -10%; height: 2px; width: 34%;
    background: linear-gradient(to right, transparent, #fff5c8, var(--gold), transparent);
    box-shadow: 0 0 16px rgba(176,141,87,0.55), 0 0 42px rgba(255,240,190,0.36);
    animation: beamSlide 1.85s 0.5s cubic-bezier(.4,0,.2,1) infinite;
  }
  .loader-glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,245,205,0.62) 0%, rgba(176,141,87,0.2) 32%, transparent 72%);
    animation: glowPulse 2.4s 0.5s ease-in-out infinite;
  }
  .loader-rays {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 100px; height: 100px;
  }
  .loader-ray {
    position: absolute; top: 50%; left: 50%;
    width: 1px; height: 40px; background: linear-gradient(to bottom, rgba(176,141,87,0.4), transparent);
    transform-origin: top center;
    animation: rayFade 2s 0.5s ease-in-out infinite;
  }
  .loader-counter {
    font-family: var(--serif); font-size: 11px; letter-spacing: 0.2em;
    color: var(--ink3); font-weight: 300;
    opacity: 0; animation: fadeIn 0.5s 0.7s forwards;
  }
  @keyframes beamSlide {
    0% { left: -30%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 110%; opacity: 0; }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.4; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); }
  }
  @keyframes rayFade {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.8; }
  }

  /* Hero */
  #hero {
    min-height: 100vh; display: block;
    border-bottom: 1px solid var(--rule);
    position: relative; overflow: hidden;
    padding-top: 68px;
    background: #100f0d;
  }
  #hero::before {
    content: '';
    position: absolute; inset: 68px 0 0;
    z-index: 1;
    background: rgba(12,10,7,0.34);
    pointer-events: none;
  }
  .hero-left {
    min-height: calc(100vh - 68px);
    display: flex; flex-direction: column; justify-content: center;
    max-width: min(720px, 48vw);
    padding: 92px 0 82px clamp(48px, 7vw, 118px);
    position: relative; z-index: 2;
  }
  .hero-right {
    position: absolute; inset: 68px 0 0;
    overflow: hidden;
    background: #11110f;
    z-index: 0;
  }
  .hero-right-img {
    position: absolute; inset: 0;
    background:
      url('images/hero-backdrop.jpg'),
      url('HD photo-252 Items/HL77029 Sand Black.jpg');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0; animation: fadeIn 1.2s 1.4s forwards;
  }
  .hero-right-img::after { display: none; }
  .hero-right-overlay {
    display: none;
  }
  .hero-right-vignette {
    display: none;
  }
  .hero-top-label {
    position: absolute; top: 104px; left: clamp(48px, 7vw, 118px); z-index: 2;
    font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(240,220,158,0.8);
    opacity: 0; animation: fadeIn 1s 1.2s forwards;
  }
  .hero-year {
    position: absolute; top: 104px; right: clamp(48px, 6vw, 96px);
    font-family: var(--serif); font-size: 14px; letter-spacing: 0.12em;
    color: rgba(240,220,158,0.76);
    opacity: 0; animation: fadeIn 1s 1.2s forwards; z-index: 2;
  }
  .hero-title {
    font-family: var(--serif);
    font-size: clamp(78px, 10vw, 168px);
    font-weight: 300; line-height: 0.88;
    letter-spacing: -0.03em; color: var(--luxury-gold);
    text-shadow: 0 8px 32px rgba(0,0,0,0.72), 0 0 24px rgba(214,185,111,0.18);
  }
  .hero-title-line { display: block; overflow: hidden; }
  .hero-title-inner {
    display: block;
    transform: translateY(100%);
    animation: slideUp 1.1s cubic-bezier(.16,1,.3,1) forwards;
  }
  .hero-title-line:nth-child(1) .hero-title-inner { animation-delay: 1.1s; }
  .hero-title-line:nth-child(2) .hero-title-inner { animation-delay: 1.25s; font-style: italic; }
  .hero-bottom {
    display: block;
    margin-top: 46px;
    opacity: 0; animation: fadeIn 1s 1.6s forwards;
  }
  .hero-desc {
    max-width: 360px; font-size: 13px; line-height: 2;
    color: rgba(250,246,232,0.82); font-weight: 300; letter-spacing: 0.01em;
    text-shadow: 0 4px 18px rgba(0,0,0,0.68);
  }
  .hero-scroll-indicator {
    position: absolute; right: clamp(34px, 5vw, 78px); bottom: 70px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 2;
  }
  .hero-scroll-indicator span {
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(240,220,158,0.72);
    writing-mode: vertical-rl;
  }
  .hero-line-anim {
    width: 1px; height: 60px;
    background: var(--luxury-gold);
    animation: lineGrow 2s 1.8s ease-out infinite;
  }
  @keyframes lineGrow {
    0% { transform: scaleY(0); transform-origin: top; opacity: 1; }
    70% { transform: scaleY(1); transform-origin: top; opacity: 1; }
    100% { transform: scaleY(1); transform-origin: top; opacity: 0; }
  }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideUp { to { transform: translateY(0); } }

  /* Category tabs */
  #categories {
    position: sticky; top: 68px; z-index: 90;
    background: rgba(250,250,248,0.97); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none;
  }
  #categories::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 20px 30px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink3); background: none; border: none; cursor: none;
    white-space: nowrap; position: relative; transition: color 0.2s;
    font-family: var(--sans); font-weight: 400; border-right: 1px solid var(--rule);
  }
  .cat-tab:first-child { border-left: none; }
  .cat-tab::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: var(--ink); transform: scaleX(0);
    transition: transform 0.3s cubic-bezier(.25,.46,.45,.94);
  }
  .cat-tab:hover { color: var(--ink); }
  .cat-tab.active { color: var(--ink); }
  .cat-tab.active::after { transform: scaleX(1); }

  /* Section */
  .cat-section { border-bottom: 1px solid var(--rule); }

  /* Section header */
  .section-header {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 72px 48px 56px; gap: 40px;
    border-bottom: 1px solid var(--rule);
  }
  .section-header-left { }
  .section-index {
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 20px;
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(48px, 6vw, 88px);
    font-weight: 300; line-height: 0.92; letter-spacing: -0.02em; color: var(--ink);
  }
  .section-title em { font-style: italic; font-weight: 300; }
  .section-header-right {
    display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4px;
  }
  .section-desc {
    font-size: 13px; line-height: 2.1; color: var(--ink2);
    font-weight: 300; max-width: 380px;
  }
  .section-count {
    font-family: var(--serif); font-size: 11px; letter-spacing: 0.15em;
    color: var(--ink3); text-transform: uppercase; margin-top: 24px;
  }

  /* Product grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-left: 1px solid var(--rule);
  }
  .product-card {
    background: var(--white);
    cursor: none; position: relative;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    transition: background 0.2s;
  }
  .product-card.has-variants .product-img-wrap::before {
    content: '';
    position: absolute; inset: 12px;
    border: 1px solid rgba(176,141,87,0.16);
    pointer-events: none; z-index: 1;
  }
  .product-img-wrap {
    width: 100%; aspect-ratio: 1 / 1;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .product-img-wrap img {
    width: 100%; height: 100%; object-fit: contain;
    padding: 24px;
    transition: transform 0.7s cubic-bezier(.16,1,.3,1);
  }
  .product-card:hover .product-img-wrap img { transform: scale(1.04); }
  .product-hover-line {
    position: absolute; bottom: 0; left: 0; right: 100%; height: 1px;
    background: var(--ink); transition: right 0.4s cubic-bezier(.25,.46,.45,.94);
  }
  .product-card:hover .product-hover-line { right: 0; }
  .product-info {
    padding: 20px 22px 24px;
    border-top: 1px solid var(--rule);
    background: var(--white);
  }
  .product-sku {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 6px; font-family: var(--sans);
  }
  .product-name {
    font-family: var(--serif); font-size: 18px; font-weight: 400;
    color: var(--ink); line-height: 1.2; margin-bottom: 4px;
  }
  .product-finish {
    font-size: 10px; color: var(--ink3); letter-spacing: 0.05em;
  }
  .product-view {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink3); margin-top: 12px;
    display: inline-block; border-bottom: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .product-card:hover .product-view { color: var(--ink); border-color: var(--ink); }
  .variant-count {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink2); background: rgba(250,250,248,0.86);
    border: 1px solid rgba(176,141,87,0.28); padding: 6px 8px;
    backdrop-filter: blur(8px);
  }

  /* Interstitial brand spread */
  .brand-spread {
    display: grid; grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .brand-spread-text {
    padding: 96px 64px; border-right: 1px solid var(--rule);
  }
  .brand-eyebrow {
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 28px;
  }
  .brand-heading {
    font-family: var(--serif);
    font-size: clamp(36px, 4vw, 62px);
    font-weight: 300; line-height: 1.1; margin-bottom: 28px; letter-spacing: -0.01em;
  }
  .brand-heading em { font-style: italic; }
  .brand-body { font-size: 13px; line-height: 2.1; color: var(--ink2); font-weight: 300; }
  .brand-spread-advantages { padding: 64px 64px; }
  .adv-item { padding: 24px 0; border-bottom: 1px solid var(--rule); }
  .adv-item:first-child { padding-top: 0; }
  .adv-item:last-child { border-bottom: none; }
  .adv-row { display: flex; align-items: baseline; gap: 20px; margin-bottom: 6px; }
  .adv-num { font-family: var(--serif); font-size: 13px; color: var(--ink3); font-weight: 300; min-width: 24px; }
  .adv-title { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink); }
  .adv-text { font-size: 12px; line-height: 1.9; color: var(--ink2); padding-left: 44px; }

  /* Applications */
  .applications { border-top: 1px solid var(--rule); }
  .app-header { padding: 72px 48px 48px; border-bottom: 1px solid var(--rule); }
  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-left: 1px solid var(--rule); }
  .app-item {
    padding: 48px 36px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    position: relative; overflow: hidden;
    transition: background 0.3s;
  }
  .app-item:hover { background: var(--white); }
  .app-big-num {
    font-family: var(--serif); font-size: 72px; font-weight: 300;
    color: var(--rule); line-height: 1; margin-bottom: 24px; letter-spacing: -0.03em;
  }
  .app-title {
    font-family: var(--serif); font-size: 28px; font-weight: 300; line-height: 1.1; margin-bottom: 16px;
  }
  .app-title em { font-style: italic; }
  .app-desc { font-size: 12px; line-height: 1.9; color: var(--ink2); }

  /* Why Hazen */
  .why-section { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .why-header { padding: 72px 48px 56px; border-bottom: 1px solid var(--rule); }
  .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1px solid var(--rule); }
  .why-item {
    padding: 44px 40px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .why-marker { font-family: var(--serif); font-size: 10px; letter-spacing: 0.2em; color: var(--ink3); margin-bottom: 14px; text-transform: uppercase; }
  .why-title { font-family: var(--serif); font-size: 22px; font-weight: 400; margin-bottom: 12px; line-height: 1.2; }
  .why-text { font-size: 12px; line-height: 1.9; color: var(--ink2); }

  /* Detail overlay */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(250,250,248,0.98); backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-inner {
    display: grid; grid-template-columns: 1fr 1fr;
    width: 88vw; max-width: 1080px; height: 82vh; max-height: 680px;
    border: 1px solid var(--rule);
    transform: translateY(30px);
    transition: transform 0.5s cubic-bezier(.16,1,.3,1);
    background: var(--white);
  }
  .detail-overlay.open .detail-inner { transform: translateY(0); }
  .detail-img-side {
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--rule); overflow: hidden;
    position: relative;
  }
  .detail-variant-rail {
    width: 100%; height: 100%;
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    scrollbar-width: thin; scrollbar-color: var(--gold) transparent;
  }
  .detail-variant-rail::-webkit-scrollbar { height: 6px; }
  .detail-variant-rail::-webkit-scrollbar-thumb { background: rgba(176,141,87,0.55); }
  .detail-variant-panel {
    flex: 0 0 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    scroll-snap-align: center; position: relative;
  }
  .detail-variant-panel img { width: 100%; height: 100%; object-fit: contain; padding: 64px; }
  .detail-variant-caption {
    position: absolute; left: 28px; bottom: 24px;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink3); background: rgba(255,255,255,0.82);
    border: 1px solid var(--rule); padding: 8px 10px;
  }
  .variant-strip {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none; margin-bottom: 24px;
  }
  .variant-strip::-webkit-scrollbar { display: none; }
  .variant-thumb {
    flex: 0 0 68px; width: 68px; height: 68px;
    background: #fff; border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center;
    cursor: none; transition: border-color 0.2s, transform 0.2s;
  }
  .variant-thumb.active { border-color: var(--ink); transform: translateY(-2px); }
  .variant-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .variant-help {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink3); margin: -8px 0 24px;
  }
  .detail-info-side {
    padding: 60px 52px; display: flex; flex-direction: column; justify-content: center;
    overflow-y: auto;
  }
  .detail-cat { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink3); margin-bottom: 20px; }
  .detail-name {
    font-family: var(--serif); font-size: 48px; font-weight: 300; line-height: 1; margin-bottom: 8px; letter-spacing: -0.02em;
  }
  .detail-sku { font-size: 11px; color: var(--ink3); letter-spacing: 0.15em; margin-bottom: 32px; }
  .detail-rule { width: 36px; height: 1px; background: var(--ink); margin-bottom: 32px; }
  .detail-body { font-size: 13px; line-height: 2.1; color: var(--ink2); margin-bottom: 36px; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
  .detail-tag {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;

  @media (max-width: 1024px) {
