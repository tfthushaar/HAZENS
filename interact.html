<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Hazen - Colour Temperature Simulator</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="enquiry.css">
<script src="enquiry-config.js" defer></script>
<script src="enquiry.js" defer></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.183.2/"
    }
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --gold: #d6b96f;
    --gold-soft: #f0dc9e;
    --gold-muted: rgba(214,185,111,0.62);
    --line: rgba(214,185,111,0.22);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html, body { min-height: 100%; background: var(--black); }

  body {
    color: var(--gold-soft);
    font-family: var(--sans);
    font-weight: 300;
    overflow: hidden;
  }

  a { color: inherit; text-decoration: none; }

  .simulator-root {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--black);
  }

  .simulator-root canvas {
    display: block;
  }

  .simulator-loader {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    background: #000;
    color: var(--gold-soft);
    opacity: 1;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .loader-core {
    display: grid;
    justify-items: center;
    gap: 24px;
    width: min(82vw, 360px);
    text-align: center;
  }

  .loader-brand {
    font-family: var(--serif);
    font-size: 34px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }

  .loader-orbit {
    position: relative;
    width: 86px;
    height: 86px;
    border: 1px solid rgba(214,185,111,0.22);
    border-radius: 50%;
  }

  .loader-orbit::before {
    content: "";
    position: absolute;
    inset: 13px;
    border-radius: 50%;
    border: 1px solid rgba(240,220,158,0.32);
  }

  .loader-orbit::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-soft);
    box-shadow: 0 0 30px rgba(240,220,158,0.92), 0 0 70px rgba(214,185,111,0.48);
    transform-origin: -36px 0;
    animation: luxury-orbit 1.6s linear infinite;
  }

  .loader-beam {
    position: relative;
    width: 100%;
    height: 1px;
    overflow: hidden;
    background: rgba(214,185,111,0.16);
  }

  .loader-beam::after {
    content: "";
    position: absolute;
    top: 0;
    left: -45%;
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    animation: luxury-beam 1.45s ease-in-out infinite;
  }

  .loader-label {
    color: var(--gold-muted);
    font-size: 10px;
    letter-spacing: 0.28em;
    line-height: 1.7;
    text-transform: uppercase;
  }

  .loader-retry {
    display: none;
    min-height: 38px;
    padding: 0 18px;
    border: 1px solid rgba(214,185,111,0.36);
    background: transparent;
    color: var(--gold-soft);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  body.is-simulator-failed .loader-retry {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  body.is-simulator-ready .simulator-loader {
    opacity: 0;
    visibility: hidden;
  }

  @keyframes luxury-orbit {
    from { transform: rotate(0deg) translateX(36px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(36px) rotate(-360deg); }
  }

  @keyframes luxury-beam {
    0% { left: -45%; opacity: 0; }
    20% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    height: 76px;
    padding: 0 clamp(20px, 5vw, 72px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(0,0,0,0.94), rgba(0,0,0,0.72));
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold-muted);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 18px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--gold-soft);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .nav-button:hover,
  .nav-button:focus-visible {
    background: var(--gold-soft);
    border-color: var(--gold-soft);
    color: var(--black);
    outline: none;
  }

  .simulator-shell {
    min-height: 100svh;
    padding-top: 76px;
    background: transparent;
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  .simulator-stage {
    position: relative;
    height: calc(100svh - 76px);
    background: transparent;
    pointer-events: none;
  }

  @media (max-width: 760px) {
    nav {
      height: 66px;
      padding: 0 14px;
      gap: 10px;
    }

    .brand {
      font-size: 18px;
      letter-spacing: 0.18em;
      flex: 0 0 auto;
    }

    .nav-center {
      display: none;
    }

    .nav-actions {
      max-width: calc(100vw - 106px);
      overflow-x: auto;
      gap: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .nav-actions::-webkit-scrollbar {
      display: none;
    }

    .nav-button {
      min-height: 34px;
      padding: 0 11px;
      font-size: 8px;
      letter-spacing: 0.12em;
      flex: 0 0 auto;
    }

    .simulator-shell {
      padding-top: 66px;
    }

    .simulator-stage {
      height: calc(100svh - 66px);
    }
  }
</style>
</head>
<body>
  <div id="root" class="simulator-root" aria-label="Interactive Hazen colour temperature simulator"></div>
  <div id="simulator-loader" class="simulator-loader" role="status" aria-label="Loading colour temperature simulator">
    <div class="loader-core">
      <div class="loader-brand">Hazen</div>
      <div class="loader-orbit" aria-hidden="true"></div>
      <div class="loader-beam" aria-hidden="true"></div>
      <div class="loader-label">Preparing colour temperature</div>
      <button class="loader-retry" type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </div>

  <nav>
    <a class="brand" href="index.html">Hazen</a>
    <div class="nav-center">Colour Temperature Simulator</div>
    <div class="nav-actions" aria-label="Simulator navigation">
      <a class="nav-button" href="products.html">Products</a>
      <a class="nav-button" href="index.html">Home</a>
      <button class="nav-button" type="button" data-enquiry-open="simulator-nav">Enquire</button>
    </div>
  </nav>

  <main class="simulator-shell">
    <section class="simulator-stage" aria-hidden="true"></section>
  </main>
  <script>
    (() => {
      const startedAt = performance.now();
      const minVisibleMs = 650;
      const loader = document.getElementById('simulator-loader');
      let settled = false;
      const markReady = () => {
        if (settled) return;
        settled = true;
        const elapsed = performance.now() - startedAt;
        window.setTimeout(() => {
          document.body.classList.add('is-simulator-ready');
          window.setTimeout(() => loader?.remove(), 800);
        }, Math.max(0, minVisibleMs - elapsed));
      };
      const markFailed = () => {
        if (settled) return;
        const canvas = document.querySelector('#root canvas');
        if (canvas) {
          markReady();
          return;
        }
        document.body.classList.add('is-simulator-failed');
        const label = document.querySelector('.loader-label');
        if (label) label.textContent = 'Unable to start simulator';
      };

      window.addEventListener('hazen-simulator-ready', markReady, { once: true });
      window.addEventListener('error', markFailed, { once: true });
      window.addEventListener('unhandledrejection', markFailed, { once: true });
      window.setTimeout(() => {
        if (!settled) {
          const canvas = document.querySelector('#root canvas');
          if (canvas) markReady();
        }
      }, 2500);
      window.setTimeout(markFailed, 8000);
    })();
  </script>
  <script type="module" src="./lamp%20asset/index.js?v=6"></script>
</body>
</html>
