<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Hazen - Colour Temperature Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="enquiry.css">
<script src="enquiry-config.js" defer></script>
<script src="enquiry.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --gold: #d6b96f;
    --gold-soft: #f0dc9e;
    --gold-muted: rgba(214,185,111,0.62);
    --line: rgba(214,185,111,0.22);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html, body { min-height: 100%; background: var(--black); }

  body {
    color: var(--gold-soft);
    font-family: var(--sans);
    font-weight: 300;
    overflow: hidden;
  }

  a { color: inherit; text-decoration: none; }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    height: 76px;
    padding: 0 clamp(20px, 5vw, 72px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(0,0,0,0.94), rgba(0,0,0,0.72));
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-family: var(--serif);
    font-size: 22px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold-muted);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0 18px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--gold-soft);
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .nav-button:hover,
  .nav-button:focus-visible {
    background: var(--gold-soft);
    border-color: var(--gold-soft);
    color: var(--black);
    outline: none;
  }

  .simulator-shell {
    min-height: 100svh;
    padding-top: 76px;
    background: var(--black);
  }

  .simulator-stage {
    position: relative;
    height: calc(100svh - 76px);
    background: var(--black);
  }

  .simulator-stage iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    background: var(--black);
  }

  @media (max-width: 760px) {
    nav {
      height: 66px;
      padding: 0 14px;
      gap: 10px;
    }

    .brand {
      font-size: 18px;
      letter-spacing: 0.18em;
      flex: 0 0 auto;
    }

    .nav-center {
      display: none;
    }

    .nav-actions {
      max-width: calc(100vw - 106px);
      overflow-x: auto;
      gap: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .nav-actions::-webkit-scrollbar {
      display: none;
    }

    .nav-button {
      min-height: 34px;
      padding: 0 11px;
      font-size: 8px;
      letter-spacing: 0.12em;
      flex: 0 0 auto;
    }

    .simulator-shell {
      padding-top: 66px;
    }

    .simulator-stage {
      height: calc(100svh - 66px);
    }
  }
</style>
</head>
<body>
  <nav>
    <a class="brand" href="index.html">Hazen</a>
    <div class="nav-center">Colour Temperature Simulator</div>
    <div class="nav-actions" aria-label="Simulator navigation">
      <a class="nav-button" href="products.html">Products</a>
      <a class="nav-button" href="index.html">Home</a>
      <button class="nav-button" type="button" data-enquiry-open="simulator-nav">Enquire</button>
    </div>
  </nav>

  <main class="simulator-shell">
    <section class="simulator-stage" aria-label="Interactive colour temperature simulator">
      <iframe src="lamp%20asset/index.html" title="Interactive Hazen colour temperature simulator" loading="eager"></iframe>
    </section>
  </main>
</body>
</html>
