<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Hazen - Product Catalogue</title>
<meta name="description" content="Browse Hazen architectural lighting products, specifications, finishes, colour temperatures, CE certification, and product families.">
<link rel="canonical" href="https://hazenlights.com/products.html">
<meta name="theme-color" content="#f7f1e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preload" href="products-app.js" as="script">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="enquiry.css">
<script src="enquiry-config.js" defer></script>
<script src="enquiry.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --bg: #f7f1e6;
    --surface: #ffffff;
    --surface-2: #ffffff;
    --ink: #111110;
    --ink2: #555550;
    --ink3: #999990;
    --rule: #ded6c9;
    --gold: #b08d57;
    --luxury-gold: #d6b96f;
    --luxury-gold-soft: #f0dc9e;
    --product-ink: #111110;
    --product-muted: #68645d;
    --product-soft: #969085;
    --product-rule: #e2e0db;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
    padding-bottom: 56px;
  }

  /* Custom cursor */
  #cursor {
    position: fixed; width: 6px; height: 6px;
    background: var(--ink); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: width 0.25s, height 0.25s, background 0.25s;
  }
  #cursor-ring {
    position: fixed; width: 32px; height: 32px;
    border: 1px solid rgba(17,17,16,0.25); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: width 0.4s cubic-bezier(.25,.46,.45,.94), height 0.4s cubic-bezier(.25,.46,.45,.94), border-color 0.3s;
  }
  body.cursor-hover #cursor { width: 3px; height: 3px; }
  body.cursor-hover #cursor-ring { width: 50px; height: 50px; border-color: rgba(17,17,16,0.5); }
  body.cursor-open #cursor-ring { width: 70px; height: 70px; }

  #root {
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  nav,
  .desktop-cat-bar,
  .mobile-cat-backdrop.open,
  .mobile-cat-panel.open,
  .cat-section,
  .detail-overlay.open,
  footer {
    pointer-events: auto;
  }

  .products-3d-hero-bg {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    height: calc(100vh - 60px);
    min-height: 620px;
    overflow: hidden;
    z-index: 0;
    background: radial-gradient(circle at 68% 44%, rgba(0,0,0,0.05), transparent 32%), var(--bg);
    pointer-events: auto;
  }

  .products-3d-hero-bg iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    pointer-events: auto;
  }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 60px;
    background: rgba(247,241,230,0.97);
    border-bottom: 1px solid var(--rule);
    backdrop-filter: blur(12px);
  }
  .nav-logo {
    font-family: var(--serif); font-size: 18px; font-weight: 500;
    letter-spacing: 0.18em; color: var(--ink); text-decoration: none;
    cursor: none; text-transform: uppercase;
  }
  .nav-actions { display: flex; align-items: center; gap: 12px; position: relative; }
  .nav-link {
    font-family: var(--sans); font-size: 10px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink2); text-decoration: none;
    background: none; border: none; cursor: none;
    transition: color 0.2s; padding: 4px 0; position: relative;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .nav-link::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 100%; height: 1px;
    background: var(--ink); transition: right 0.3s cubic-bezier(.25,.46,.45,.94);
  }
  .nav-link:hover, .nav-link.active { color: var(--ink); }
  .nav-link:hover::after, .nav-link.active::after { right: 0; }

  .desktop-cat-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    height: 56px;
    display: grid;
    background: rgba(247,241,230,0.97);
    border-top: 1px solid var(--rule);
    backdrop-filter: blur(12px);
  }
  .desktop-cat-inner {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
    width: 100%;
  }
  .desktop-cat-link {
    min-width: 0;
    border: 0;
    border-right: 1px solid var(--rule);
    background: transparent;
    color: var(--ink2);
    cursor: none;
    font-family: var(--sans);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.14em;
    line-height: 1;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.2s, background 0.2s;
  }
  .desktop-cat-link:last-child { border-right: 0; }
  .desktop-cat-link:hover,
  .desktop-cat-link.active {
    background: rgba(255,255,255,0.42);
    color: var(--ink);
  }
  .nav-cta {
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    border: 1px solid var(--ink); color: var(--ink);
    padding: 8px 18px; background: none; cursor: none;
    text-decoration: none;
    transition: background 0.25s, color 0.25s;
  }
  .nav-cta:hover { background: var(--ink); border-color: var(--ink); color: var(--white); }

  .mobile-cat-trigger,
  .mobile-cat-backdrop,
  .mobile-cat-panel {
    display: none;
  }
  body.cat-menu-open {
    overflow: hidden;
  }
  .mobile-cat-backdrop {
    position: fixed;
    inset: 0;
    z-index: 108;
    background: rgba(17,17,16,0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .mobile-cat-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .mobile-cat-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 109;
    width: min(84vw, 340px);
    background: rgba(247,241,230,0.98);
    border-left: 1px solid var(--rule);
    box-shadow: -24px 0 60px rgba(17,17,16,0.14);
    transform: translateX(100%);
    transition: transform 0.34s cubic-bezier(.25,.46,.45,.94);
    pointer-events: none;
  }
  .mobile-cat-panel.open {
    transform: translateX(0);
    pointer-events: auto;
  }
  .mobile-cat-inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 24px 22px;
  }
  .mobile-cat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .mobile-cat-title {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink2);
  }
  .mobile-cat-close {
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0;
    cursor: none;
  }
  .mobile-cat-list {
    display: grid;
    gap: 0;
    overflow-y: auto;
    padding: 10px 0 4px;
  }
  .mobile-cat-item {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 14px;
    align-items: center;
    width: 100%;
    min-height: 48px;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: var(--ink2);
    text-align: left;
    cursor: none;
  }
  .mobile-cat-index {
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink3);
  }
  .mobile-cat-name {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink2);
  }
  .mobile-cat-item.active .mobile-cat-name,
  .mobile-cat-item:focus-visible .mobile-cat-name {
    color: var(--ink);
  }
  .mobile-cat-item:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: -1px;
  }

  .search-wrap { position: relative; }
  .search-trigger.active { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .search-panel {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: min(360px, calc(100vw - 32px));
    padding: 18px 0 10px;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    background: rgba(247,241,230,0.98);
    box-shadow: 0 24px 60px rgba(17,17,16,0.12);
  }
  .search-input {
    width: calc(100% - 28px);
    height: 32px;
    margin: 0 14px;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.04em;
    outline: none;
    padding: 0 0 10px;
    cursor: none;
  }
  .search-input::placeholder {
    color: var(--ink3);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 9px;
  }
  .search-results {
    margin-top: 14px;
    display: grid;
    max-height: min(360px, 56vh);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(17,17,16,0.3) transparent;
  }
  .search-result {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
    width: 100%;
    padding: 13px 14px;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: var(--ink2);
    text-align: left;
    cursor: none;
    transition: background 0.2s, color 0.2s;
  }
  .search-result:hover,
  .search-result:focus-visible {
    background: var(--white);
    outline: none;
  }
  .search-name {
    display: block;
    font-family: var(--sans);
    color: var(--ink);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: 0.01em;
    font-variant-numeric: lining-nums proportional-nums;
    font-feature-settings: "lnum" 1, "pnum" 1;
  }
  .search-meta,
  .search-count,
  .search-empty {
    display: block;
    font-family: var(--sans);
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink3);
  }
  .search-meta { margin-top: 5px; }
  .search-count { white-space: nowrap; color: var(--ink3); }
  .search-empty {
    padding: 16px 14px 8px;
    text-align: left;
    background: transparent;
  }
  .product-card.is-search-target {
    box-shadow: inset 0 0 0 1px var(--ink);
    z-index: 2;
  }

  /* Loading screen */
  #loader {
    position: fixed; inset: 0; z-index: 1000;
    background:
      radial-gradient(circle at 50% 42%, #fffef9 0%, #f7f1e6 42%, #e6d9c8 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.42s cubic-bezier(.4,0,.2,1), transform 0.42s cubic-bezier(.4,0,.2,1);
  }
  #loader.done { opacity: 0; pointer-events: none; transform: translateY(-8px); }
  .loader-stage {
    display: grid;
    justify-items: center;
    gap: 22px;
    width: min(74vw, 420px);
  }
  .loader-brand {
    font-family: var(--serif); font-size: clamp(30px, 6vw, 46px); font-weight: 300;
    letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink);
    text-shadow: none;
    opacity: 0; animation: fadeIn 0.8s 0.2s forwards;
  }
  .loader-aperture {
    position: relative;
    width: 100%;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    opacity: 0; animation: fadeIn 0.5s 0.5s forwards;
  }
  .loader-aperture::before {
    content: '';
    position: absolute;
    left: 8%;
    right: 8%;
    top: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(176,141,87,0.34), rgba(255,245,199,0.86), rgba(176,141,87,0.34), transparent);
    box-shadow: none;
  }
  .loader-aperture::after {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 14px;
    width: 38px;
    background: linear-gradient(90deg, transparent, rgba(255,248,213,0.72), transparent);
    transform: translateX(-180px) skewX(-12deg);
    animation: apertureSweep 1.55s cubic-bezier(.4,0,.2,1) infinite;
  }
  .loader-line {
    width: 38%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(176,141,87,0.52));
  }
  .loader-line:last-child {
    transform: scaleX(-1);
  }
  .loader-core {
    width: 12px;
    height: 12px;
    margin: 0 18px;
    border: 1px solid rgba(176,141,87,0.8);
    transform: rotate(45deg);
    box-shadow: none;
    animation: corePulse 1.55s ease-in-out infinite;
  }
  .loader-counter {
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink3); font-weight: 300;
    opacity: 0; animation: fadeIn 0.5s 0.7s forwards;
  }
  @keyframes apertureSweep {
    0% { transform: translateX(-190px) skewX(-12deg); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(190px) skewX(-12deg); opacity: 0; }
  }
  @keyframes corePulse {
    0%, 100% { transform: rotate(45deg) scale(0.82); opacity: 0.72; }
    50% { transform: rotate(45deg) scale(1.18); opacity: 1; }
  }

  /* Hero */
  #hero {
    min-height: 100vh; display: block;
    border-bottom: 1px solid var(--rule);
    position: relative; overflow: hidden;
    padding-top: 60px;
    background: transparent;
    pointer-events: none;
  }
  #hero::before {
    content: '';
    position: absolute; inset: 60px 0 0;
    z-index: 1;
    background: linear-gradient(90deg, rgba(247,241,230,0.82) 0%, rgba(247,241,230,0.62) 34%, rgba(247,241,230,0.18) 62%, rgba(247,241,230,0.04) 100%);
    pointer-events: none;
  }
  .hero-left {
    min-height: calc(100vh - 60px);
    display: flex; flex-direction: column; justify-content: center;
    max-width: min(900px, 60vw);
    padding: 92px 0 82px clamp(48px, 7vw, 118px);
    position: relative; z-index: 2;
  }
  .hero-right {
    position: absolute; inset: 60px 0 0;
    overflow: hidden;
    background: transparent;
    z-index: 0;
  }
  .hero-right-img {
    display: none;
    position: absolute; inset: 0;
    background:
      url('images/hero-backdrop.jpg'),
      url('HD photo-252 Items/HL77029 Sand Black.jpg');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 1; animation: none;
  }
  .hero-right-img::after { display: none; }
  .hero-right-overlay {
    display: none;
  }
  .hero-right-vignette {
    display: none;
  }
  .hero-top-label {
    position: absolute; top: 104px; left: clamp(48px, 7vw, 118px); z-index: 2;
    font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(17,17,16,0.58);
    opacity: 1; animation: none;
  }
  .hero-year {
    position: absolute; top: 104px; right: clamp(48px, 6vw, 96px);
    font-family: var(--serif); font-size: 14px; letter-spacing: 0.12em;
    color: rgba(17,17,16,0.58);
    opacity: 1; animation: none; z-index: 2;
  }
  .hero-title {
    font-family: var(--serif);
    font-size: clamp(90px, 12vw, 190px);
    font-weight: 300; line-height: 0.88;
    letter-spacing: 0.16em; color: var(--ink);
    text-shadow: none;
    text-transform: uppercase;
  }
  .hero-title-line { display: block; overflow: hidden; }
  .hero-title-inner {
    display: block;
    transform: translateY(0);
    animation: none;
  }
  .hero-title-line:nth-child(1) .hero-title-inner { animation-delay: 1.1s; }
  .hero-title-line:nth-child(2) .hero-title-inner { animation-delay: 1.25s; font-style: italic; }
  .hero-tagline {
    margin-top: 10px;
    font-family: var(--serif);
    font-size: clamp(13px, 1.4vw, 18px);
    font-weight: 300;
    line-height: 1;
    font-style: normal;
    letter-spacing: 0.18em;
    color: var(--ink2);
  }
  .hero-bottom {
    display: block;
    margin-top: 36px;
    opacity: 1; animation: none;
  }
  .hero-desc {
    max-width: 360px; font-size: 13px; line-height: 2;
    color: rgba(17,17,16,0.7); font-weight: 300; letter-spacing: 0.01em;
    text-shadow: none;
  }
  .hero-scroll-indicator {
    position: absolute; right: clamp(34px, 5vw, 78px); bottom: 70px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    z-index: 2;
  }
  .hero-scroll-indicator span {
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(17,17,16,0.5);
    writing-mode: vertical-rl;
  }
  .hero-line-anim {
    width: 1px; height: 60px;
    background: rgba(17,17,16,0.6);
    animation: lineGrow 2s 1.8s ease-out infinite;
  }
  @keyframes lineGrow {
    0% { transform: scaleY(0); transform-origin: top; opacity: 1; }
    70% { transform: scaleY(1); transform-origin: top; opacity: 1; }
    100% { transform: scaleY(1); transform-origin: top; opacity: 0; }
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideUp { to { transform: translateY(0); } }

  /* Section */
  .cat-section {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }

  /* Section header */
  .section-header {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 68px 48px 52px; gap: 40px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }
  .section-header-left { }
  .section-index {
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--ink3); margin-bottom: 20px;
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(48px, 6vw, 88px);
    font-weight: 300; line-height: 0.92; letter-spacing: 0; color: var(--ink);
  }
  .section-title em { font-style: italic; font-weight: 300; color: var(--ink); }
  .section-header-right {
    display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4px;
  }
  .section-desc {
    font-size: 13px; line-height: 2.1; color: var(--ink2);
    font-weight: 300; max-width: 380px;
  }
  .section-count {
    font-family: var(--serif); font-size: 11px; letter-spacing: 0.15em;
    color: var(--ink3); text-transform: uppercase; margin-top: 24px;
  }

  /* Product grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-left: 1px solid var(--product-rule);
    background: var(--white);
  }
  .product-card {
    background: var(--white);
    cursor: none; position: relative;
    border-right: 1px solid var(--product-rule);
    border-bottom: 1px solid var(--product-rule);
    transition: background 0.2s;
  }
  .product-card.has-variants .product-img-wrap::before {
    content: '';
    position: absolute; inset: 12px;
    border: 1px solid rgba(176,141,87,0.14);
    pointer-events: none; z-index: 1;
  }
  .product-img-wrap {
    width: 100%; aspect-ratio: 1 / 1;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .product-img-wrap img {
    width: 100%; height: 100%; object-fit: contain;
    padding: 24px;
    transition: transform 0.7s cubic-bezier(.16,1,.3,1);
  }
  .product-card:hover .product-img-wrap img { transform: scale(1.018); }
  .product-hover-line {
    position: absolute; bottom: 0; left: 0; right: 100%; height: 1px;
    background: var(--ink); transition: right 0.4s cubic-bezier(.25,.46,.45,.94);
  }
  .product-card:hover .product-hover-line { right: 0; }
  .product-ce-badge {
    width: 26px; height: 26px;
    object-fit: contain; flex-shrink: 0; opacity: 0.9;
  }
  .product-info {
    padding: 20px 22px 24px;
    border-top: 1px solid var(--product-rule);
    background: var(--white);
  }
  .product-sku {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--product-soft); margin-bottom: 6px; font-family: var(--sans);
  }

<div id="loader" role="status" aria-label="Loading Hazen catalogue">

    <div class="loader-brand">Hazen</div>

  <iframe src="3d asset/index.html" title="Hazen 3D architectural lighting scene" loading="eager" id="model3dIframe"></iframe>
  <div class="model-toggle-wrap" id="modelToggleWrap">
    <span class="model-toggle-label" id="modelToggleLabel">SCROLL</span>
    <button class="model-toggle-btn" id="modelToggleBtn" aria-label="Toggle 3D model interaction" aria-pressed="false">
      <span class="model-toggle-knob"></span>
    </button>

<script>
  window.HAZEN_LOADER_STARTED_AT = performance.now();
  window.HAZEN_LOADER_MIN_MS = 1500;
  window.HAZEN_FINISH_LOADER = () => {
    const loader = document.getElementById('loader');
    if (!loader || loader.classList.contains('done')) return;
    const elapsed = performance.now() - window.HAZEN_LOADER_STARTED_AT;
    const delay = Math.max(0, window.HAZEN_LOADER_MIN_MS - elapsed);
    window.clearTimeout(window.HAZEN_LOADER_TIMER);
    window.HAZEN_LOADER_TIMER = window.setTimeout(() => loader.classList.add('done'), delay);
  };
  window.addEventListener('DOMContentLoaded', window.HAZEN_FINISH_LOADER, { once: true });
</script>
<script>
  (() => {
    const iframe = document.querySelector('.products-3d-hero-bg iframe');
    if (!iframe) return;

    window.addEventListener('message', (event) => {
      if (event.source !== iframe.contentWindow) return;
      const data = event.data || {};
      if (data.type !== 'hazen-3d-pointer') return;
      if (!Number.isFinite(data.x) || !Number.isFinite(data.y)) return;

      const rect = iframe.getBoundingClientRect();
      window.dispatchEvent(new MouseEvent('mousemove', {
        clientX: rect.left + data.x,
        clientY: rect.top + data.y,
        bubbles: true,
      }));
    });
  })();
</script>
<script>
  (() => {
    const isMobile = () => window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 768;
    const iframe = document.getElementById('model3dIframe');
    const btn = document.getElementById('modelToggleBtn');
    const label = document.getElementById('modelToggleLabel');
    if (!iframe || !btn || !isMobile()) return;

    // Default: non-interactive so page scrolls freely
    iframe.style.pointerEvents = 'none';
    let on = false;

    btn.addEventListener('click', () => {
      on = !on;
      iframe.style.pointerEvents = on ? 'auto' : 'none';
      iframe.style.touchAction = on ? 'none' : '';
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on);
      label.textContent = on ? 'INTERACT' : 'SCROLL';
      label.classList.toggle('is-on', on);
    });

    // Reset to scroll mode on orientation change
    window.addEventListener('resize', () => {
      if (!isMobile()) { iframe.style.pointerEvents = 'auto'; return; }
      on = false;
      iframe.style.pointerEvents = 'none';
      iframe.style.touchAction = '';
      btn.classList.remove('is-on');
      btn.setAttribute('aria-pressed', 'false');
      label.textContent = 'SCROLL';
      label.classList.remove('is-on');
    });
  })();
</script>

<script>
  (() => {
    const CERTIFICATION_VALUE = 'CE Certified';

    function addCardCertifications(root = document) {
      root.querySelectorAll('.product-card').forEach((card) => {
        const info = card.querySelector('.product-info');
        if (!info || info.querySelector('.product-cert')) return;

        const cert = document.createElement('div');
        cert.className = 'product-cert';
        cert.textContent = CERTIFICATION_VALUE;

        const viewLink = info.querySelector('.product-view');
        if (viewLink) {
          info.insertBefore(cert, viewLink);
        } else {
          info.appendChild(cert);
        }
      });
    }

    function addDetailCertification(root = document) {
      root.querySelectorAll('.detail-specs').forEach((specs) => {
        if (specs.querySelector('[data-certification-row="true"]')) return;

        const row = document.createElement('div');
        row.className = 'detail-spec';
        row.dataset.certificationRow = 'true';
        row.innerHTML = '<span class="detail-spec-label">Certification</span><span class="detail-spec-value">CE Certified</span>';
        specs.appendChild(row);
      });
    }

    function applyCertifications() {
      const root = document.getElementById('root') || document;
      addCardCertifications(root);
      addDetailCertification(root);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const root = document.getElementById('root');
      applyCertifications();
      if (root) {
        new MutationObserver(applyCertifications).observe(root, {
          childList: true,
          subtree: true,
        });
      }
    });
  })();
</script>
</body>
</html>
